# patched by rust-curse with love <3
[package]
name = "library-example"
version = "0.1.0"
edition = "2021"
publish = false
build = ".rust-curse/build.rs" # do not change

[lib]
path = ".rust-curse/lib.rs" # do not change

[dependencies]
taffy = { version = "0.3" }
napi = { version = "3", optional = true } # do not change
napi-derive = { version = "3", optional = true } # do not change

[features]
napi = ["dep:napi", "dep:napi-derive"] # do not change

[build-dependencies]
napi-build = { version = "2", optional = true } # do not change
