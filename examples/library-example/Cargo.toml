[package]
name = "library-example"
version = "0.1.0"
edition = "2021"
publish = false
build = ".rust-curse/build.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
napi = { version = "3", optional = true }
napi-derive = { version = "3", optional = true }

[lib]
path = ".rust-curse/lib.rs"

[features]
target-node = ["dep:napi", "dep:napi-derive"]

[build-dependencies]
napi-build = { version = "2" }
