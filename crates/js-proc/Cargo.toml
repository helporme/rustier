[package]
name = "rustier_js_proc"
version = "0.1.2"
edition = "2024"
description = "Procedural macro expansion for Rustier JavaScript calls."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro-crate = "3"
proc-macro2 = "1"
rustier_js_syntax = { path = "../js-syntax", version = "=0.1.2" }
quote = "1"
syn = { version = "2", features = ["visit"] }

[dev-dependencies]
rustier = { path = "../rustier" }
