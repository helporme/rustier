[package]
name = "rustier_workspace"
version = "0.0.1"
edition = "2024"
description = "Application-facing compiler workspace for Rustier."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[dependencies]
rustier_compiler = { path = "../compiler", version = "0.0.1" }
ra_ap_base_db = "=0.0.345"
ra_ap_hir = "=0.0.345"
ra_ap_load-cargo = "=0.0.345"
ra_ap_project_model = "=0.0.345"
ra_ap_vfs = "=0.0.345"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.rustier_compiler]
opt-level = 0
