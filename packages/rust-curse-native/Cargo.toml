[package]
name = "rust-curse"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["napi-binding"]
napi-binding = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:tracing-subscriber"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "async"], optional = true }
napi-derive = { version = "3", features = ["type-def"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustdoc-types = "0.57"
salsa = "0.27"
glob = "0.3"
toml_edit = "0.25"
thiserror = "2.0.18"
cargo_metadata = "0.23.1"
miette = { version = "7", features = ["fancy"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi", "std"], optional = true }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
insta = { version = "1", features = ["filters"] }
prettyplease = "0.2"
syn = { version = "2", features = ["parsing"] }
