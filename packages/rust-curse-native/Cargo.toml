[package]
name = "rust-curse"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["napi-binding"]
napi-binding = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"], optional = true }
napi-derive = { version = "3", features = ["type-def"], optional = true }
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustdoc-types = "0.57"
glob = "0.3"
toml_edit = "0.25"
anyhow = "1.0.102"
thiserror = "2.0.18"

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
