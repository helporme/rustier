[package]
name = "rust-curse"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
toml_edit = "0.25"
anyhow = "1.0.102"
thiserror = "2.0.18"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3.27.0"
