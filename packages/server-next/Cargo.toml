[package]
name = "server-next"
version = "0.0.1"
edition = "2024"
description = "Rustier's macro-based compiler server."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compiler = { package = "compiler-next", path = "../compiler-next" }
salsa = "=0.27.2"
ra_ap_load-cargo = "=0.0.345"
ra_ap_project_model = "=0.0.345"
ra_ap_vfs = "=0.0.345"
ra_ap_base_db = "=0.0.345"
ra_ap_hir = "=0.0.345"
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"
notify = "8"
serde_json = "1"

[build-dependencies]
napi-build = "2"

# The server is a separate Cargo root, so it needs the same dependency profile.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.compiler-next]
opt-level = 0
