[package]
name = "server-next"
version = "0.0.1"
edition = "2024"
description = "Rustier's snippet-based compiler server."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compiler = { package = "compiler-next", path = "../compiler-next" }
salsa = "=0.27.2"
napi = { version = "3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
