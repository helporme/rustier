name: rustier-compiler-dev

services:
  compiler:
    build:
      context: ../..
      dockerfile: packages/site-compiler-service/Dockerfile
    environment:
      COMPILER_TOKEN: ${COMPILER_TOKEN:?Set COMPILER_TOKEN or use pnpm dev}
      COMPILER_WORKERS: ${COMPILER_WORKERS:-2}
      COMPILER_IDLE_MS: ${COMPILER_IDLE_MS:-120000}
    ports:
      - '127.0.0.1:${COMPILER_PORT:-3001}:3001'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    # Bubblewrap creates its own namespaces inside the unprivileged container.
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - systempaths=unconfined
      - apparmor=unconfined
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 70s
    develop:
      watch:
        - path: ../rustier/src
          action: rebuild
        - path: ../rustier-native/src
          action: rebuild
        - path: ../rustier-rt/src
          action: rebuild
