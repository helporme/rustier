[package]
name = "compiler-next"
version = "0.0.1"
edition = "2024"
description = "Rustier's macro-based compiler."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[dependencies]
blake3 = "1"
salsa = "=0.27.2"
ra_ap_hir = "=0.0.345"
ra_ap_hir_def = "=0.0.345"
ra_ap_hir_ty = "=0.0.345"
ra_ap_ide_db = "=0.0.345"
ra_ap_base_db = "=0.0.345"
ra_ap_syntax = "=0.0.345"
ra_ap_vfs = "=0.0.345"
oxc_allocator = "=0.138.0"
oxc_ast = "=0.138.0"
oxc_diagnostics = "=0.138.0"
oxc_parser = "=0.138.0"
oxc_semantic = "=0.138.0"
oxc_span = "=0.138.0"
toml = "0.9"
miette = { version = "7", features = ["fancy-no-syscall"] }
thiserror = "2"
triomphe = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
insta = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"

# Keep compiler code easy to debug while optimizing RA and its dependencies.
[profile.dev.package."*"]
opt-level = 3
