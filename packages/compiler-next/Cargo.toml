[package]
name = "compiler-next"
version = "0.0.1"
edition = "2024"
description = "Rustier's snippet-based compiler."
license = "MIT"
repository = "https://github.com/helporme/rustier"

[dependencies]
salsa = "=0.27.2"
ra_ap_hir = "=0.0.345"
ra_ap_ide_db = "=0.0.345"

[dev-dependencies]
tempfile = "3.27.0"
insta = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
