[package]
name = "rustier"
version = "0.0.1"
edition = "2024"
description = "Import Rust code in JavaScript and TypeScript builds."
license = "MIT"
license-file = "../../LICENSE"
repository = "https://github.com/helporme/rustier"
readme = "../../README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
napi-binding = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:ra_ap_load-cargo", "dep:ra_ap_project_model"]
local-runtime = []

[dependencies]
rustier-rt = { version = "=0.0.1", path = "../rustier-rt" }
napi = { version = "3", default-features = false, features = ["napi6", "serde-json", "async"], optional = true }
napi-derive = { version = "3", features = ["type-def"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustdoc-types = "0.57"
salsa = "=0.27.2"
ra_ap_hir = "=0.0.345"
ra_ap_ide_db = "=0.0.345"
ra_ap_syntax = "=0.0.345"
ra_ap_vfs = "=0.0.345"
ra_ap_cfg = "=0.0.345"
ra_ap_edition = "=0.0.345"
ra_ap_load-cargo = { version = "=0.0.345", optional = true }
ra_ap_project_model = { version = "=0.0.345", optional = true }
triomphe = "0.1"
glob = "0.3"
indoc = "2"
thiserror = "2.0.18"
cargo_metadata = "0.23.1"
miette = { version = "7", features = ["fancy-no-syscall"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
anyhow = "1.0.104"
itertools = "0.15.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
miette = { version = "7", features = ["fancy", "syntect-highlighter"] }

[build-dependencies]
napi-build = { version = "2", optional = true }

[dev-dependencies]
ra_ap_load-cargo = "=0.0.345"
ra_ap_project_model = "=0.0.345"
datatest-stable = "0.3"
tempfile = "3.27.0"
insta = { version = "1", features = ["filters"] }
oxc_allocator = "=0.138.0"
oxc_parser = "=0.138.0"
oxc_span = "=0.138.0"
prettyplease = "0.2"
proptest = "1"
ra_ap_test_fixture = "=0.0.345"
syn = { version = "2", features = ["parsing"] }

[[test]]
name = "ui"
path = "tests/ui.rs"
harness = false

[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false