services:
  site:
    build:
      context: ../../..
      dockerfile: packages/site/deploy/Dockerfile
      target: site
    environment:
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: '1'
      COMPILER_URL: http://compiler:3001
      COMPILER_TOKEN: ${COMPILER_TOKEN:?Set a compiler authentication token}
      COMPILER_MAX_PENDING_PER_IP: ${COMPILER_MAX_PENDING_PER_IP:-1}
      BODY_SIZE_LIMIT: 128K
    expose:
      - '3000'
    depends_on:
      compiler:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    networks:
      - default
      - compilation
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s

  compiler:
    build:
      context: ../../..
      dockerfile: packages/site/deploy/Dockerfile
      target: compiler
    environment:
      COMPILER_TOKEN: ${COMPILER_TOKEN:?Set a compiler authentication token}
      COMPILER_WORKERS: ${COMPILER_WORKERS:-2}
      COMPILER_IDLE_MS: ${COMPILER_IDLE_MS:-120000}
    expose:
      - '3001'
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
      - systempaths=unconfined
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 2
    pids_limit: 256
    networks:
      - compilation
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      start_period: 70s

networks:
  compilation:
    internal: true
