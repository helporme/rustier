services:
  site:
    image: node:24.21.0-bookworm-slim@sha256:d6aa754f16b3197301076f047b5def2f02ea1dbbc2ca920407d46d7ec7f87b20
    user: node
    working_dir: /app
    command: ['node', 'current/site/build']
    volumes:
      - /opt/rustier-site/releases:/app:ro
    environment:
      HOST: '::'
      NODE_ENV: production
      PORT: '3000'

  compiler:
    image: ${COMPILER_IMAGE:?Set the compiler image}
    environment:
      COMPILER_WORKERS: '1'
    mem_limit: 3g
    memswap_limit: 3g

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set the public hostname}
      CLOUDFLARE_TRUSTED_PROXIES: ${CLOUDFLARE_TRUSTED_PROXIES:?Set the Cloudflare proxy ranges}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      site:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      start_period: 10s

networks:
  default:
    enable_ipv6: true

volumes:
  caddy_data:
  caddy_config:
