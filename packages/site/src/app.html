<!doctype html>
<!-- Animate named elements only, without crossfading the entire page. -->
<html lang="en" class="[view-transition-name:none] has-[[data-slot=site-waves]]:bg-java!">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
