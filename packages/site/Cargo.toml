[package]
name = "rustier-site"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
rustier = { path = "../rustier-native" }
ra_ap_hir = "=0.0.345"
ra_ap_ide = "=0.0.345"
ra_ap_ide_db = "=0.0.345"
ra_ap_cfg = "=0.0.345"
triomphe = "0.1"
unicode-ident = "=1.0.24"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
ra_ap_paths = "=0.0.345"
