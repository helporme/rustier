packages:
  - packages/rustier
  - packages/rustier/npm/*
  - packages/site
  - packages/site-compiler-service
  - crates/server
  - examples/*
# Use the bindings built alongside the plugin; its published manifests still
# pin exact registry versions for consumers outside this workspace.
linkWorkspacePackages: true
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - rustier@0.0.0-bootstrap || 0.1.0-bootstrap || 0.1.0-bootstrap.1
  - rustier-bindings-darwin-arm64@0.1.0
  - rustier-bindings-darwin-x64@0.1.0
  - rustier-bindings-linux-arm64-gnu@0.1.0
  - rustier-bindings-linux-arm64-musl@0.1.0
  - rustier-bindings-linux-x64-gnu@0.1.0
  - rustier-bindings-linux-x64-musl@0.1.0
  - rustier-bindings-unknown-unknown-unknown@0.1.0
  - rustier-bindings-win32-arm64-msvc@0.1.0
  - rustier-bindings-win32-x64-msvc@0.1.0
